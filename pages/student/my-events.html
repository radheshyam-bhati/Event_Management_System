<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>My Registrations — Obsidian Ledger</title>
    <script src="https://code.iconify.design/iconify-icon/3.0.0/iconify-icon.min.js"></script>
    <link rel="stylesheet" href="../../css/main.css" />
    <link rel="stylesheet" href="../../css/pages/registrations.css" />
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar">
        <a href="dashboard.html" class="section-title">Obsidian Ledger</a>
        <div class="topbar-actions">
          <a href="events.html" class="text-sm">Discover Events</a>
          <a href="../shared/notifications.html" class="btn-icon"><iconify-icon icon="lucide:bell"></iconify-icon></a>
        </div>
      </header>

      <main class="container-lg">
        <p class="eyebrow">Student record</p>
        <h1 class="page-title">My Registrations</h1>

        <div class="tabs-bar">
          <button type="button" class="tab-btn tab-btn--active">Upcoming <span id="tab-upcoming-count" class="font-mono text-xs"></span></button>
          <button type="button" class="tab-btn">Waitlisted <span id="tab-waitlisted-count" class="font-mono text-xs"></span></button>
          <button type="button" class="tab-btn">Past <span id="tab-past-count" class="font-mono text-xs"></span></button>
        </div>

        <section id="registrations-list" class="flex flex-col gap-4 mt-6"></section>

        <section class="promotion-banner">
          <div>
            <p class="font-mono text-xs">PROMOTION ALERT</p>
            <h2 class="section-title mt-2">You’re registered!</h2>
            <p class="text-sm mt-2">A place has opened and you’ve been moved to Registered.</p>
          </div>
          <a href="event-details.html" class="btn btn-primary">View My Ticket</a>
        </section>
      </main>
    </div>

    <script src="../../js/config.js"></script>
    <script src="../../js/app.js"></script>
    <script src="../../js/student/my-events.js"></script>
  </body>
</html>
