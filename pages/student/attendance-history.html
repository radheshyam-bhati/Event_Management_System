<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Attendance History — Obsidian Ledger</title>
    <script src="https://code.iconify.design/iconify-icon/3.0.0/iconify-icon.min.js"></script>
    <link rel="stylesheet" href="../../css/main.css" />
    <link rel="stylesheet" href="../../css/pages/attendance.css" />
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar">
        <a href="dashboard.html" class="section-title">Obsidian Ledger</a>
        <a href="my-events.html" class="text-sm font-semibold">My Registrations</a>
      </header>

      <main class="container-lg">
        <p class="eyebrow">Participation record</p>
        <h1 class="page-title">Attendance History</h1>

        <section class="att-stats-grid">
          <div class="card card-padded"><p id="att-attended" class="kpi-value"></p><p class="text-sm text-muted mt-2">Events Attended</p></div>
          <div class="card card-padded"><p id="att-noshows" class="kpi-value"></p><p class="text-sm text-muted mt-2">No-shows</p></div>
          <div class="card card-padded"><p id="att-rate" class="kpi-value"></p><p class="text-sm text-muted mt-2">Attendance Rate</p></div>
        </section>

        <section class="table-card">
          <div class="att-table-head"><span>EVENT</span><span>DATE</span><span>CATEGORY</span><span>STATUS</span></div>
          <div id="attendance-rows"></div>
        </section>
      </main>
    </div>

    <script src="../../js/config.js"></script>
    <script src="../../js/app.js"></script>
    <script src="../../js/student/attendance-history.js"></script>
  </body>
</html>
